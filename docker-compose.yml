services:
  wecom-callback:
    # 直接拉预构建镜像升级，不用在 NAS 上放源码、不用 build。
    # 镜像由 GitHub Actions 在每次 push 到 main 后自动构建并推到 ghcr.io。
    image: ghcr.io/wdw6733/wecom-callback-bridge:latest
    container_name: wecom-callback
    restart: unless-stopped
    env_file: .env
    ports:
      # 宿主机端口 : 容器端口。改宿主机端口只改冒号前面那个数字，
      # 回调 URL 里的端口要跟着改。
      - "18789:18789"
    volumes:
      # Docker Engine API：管理 NAS 上的容器
      - /var/run/docker.sock:/var/run/docker.sock
      # 只读挂载：读 NAS 主机的负载、内存、磁盘
      - /proc:/host/proc:ro
      - /:/host:ro
      # 只读挂载：读温度传感器（VM 内通常读不到，没有它也不影响）
      - /sys:/host/sys:ro
      # 只读挂载：读数据盘用量（必须是宿主机上真实存在的路径）
      - /mnt/PT:/host/mnt/PT:ro
      - /mnt/Strongge:/host/mnt/Strongge:ro
      # 持久化数据（去重缓存等以后可能用到）
      - ./data:/data
      # ESXi SSH 私钥（可选）：想用 key 连 ESXi 而不是密码时，
      # 把私钥放进 ./data/id_ed25519，取消下面这行的注释，
      # 并在 .env 里填 ESXI_KEY_FILE=/data/id_ed25519。
      # - ./data/id_ed25519:/data/id_ed25519:ro
